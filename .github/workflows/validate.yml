name: SignalForge validation
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract and syntax-check inline JavaScript
        run: |
          python3 - <<'PY'
          import re
          html=open('index.html',encoding='utf-8').read()
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          assert scripts, 'No inline application script found'
          open('/tmp/signalforge.js','w',encoding='utf-8').write('\n'.join(scripts))
          print('Extracted',len(scripts),'script(s)')
          PY
          node --check /tmp/signalforge.js
      - name: Check product boundaries
        run: |
          grep -q 'signalforge-local-db' index.html
          grep -q 'crypto.subtle' index.html
          grep -q 'SIMULATION ONLY' index.html
          ! grep -Eq 'fetch\(|XMLHttpRequest|https?://[^ ]+api' index.html
